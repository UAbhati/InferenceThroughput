[project]
name = "interference-throughput"
version = "0.1.0"
description = "High-throughput inference gateway with RPM/TPM rate limiting, async batches, provider simulator and load generator"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn[standard]", "httpx", "numpy", "uvloop", "pydantic>=2", "pyyaml", "aiohttp"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
report = ["matplotlib"]
persistence = ["asyncpg", "redis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
