name: http-ceiling-probe
description: >
  Not a pass/fail scenario. Takes the rate limits out of the way and offers 6,000 requests/s to the HTTP gateway to see
  whether one gateway process keeps up (it did: 6,000/s completed, no errors). The result is a floor, not a ceiling.
mode: http
kind: generic
duration_s: 20
warmup_s: 8
drain_s: 20
models:
  model-a: {rpm: 100000000, tpm: 100000000000, latency_ms_median: 50, latency_sigma: 0.2}
load: {rate_per_s: 6000, mix: {model-a: 1.0}, token_size: 1000}
engine: {queue_max: 500000, queue_ttl_s: 30, headroom: 1.0}
