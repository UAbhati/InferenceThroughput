name: s4-crash-recovery
description: >
  Durability check (needs Postgres, see README). A batch of 10,000 requests with a callback is accepted; once 30% of it is final the
  gateway process is killed with SIGKILL, then started again. The new gateway must finish the batch, deliver the callback once, and
  report every request id exactly once.
mode: http
kind: recovery
duration_s: 180
warmup_s: 0
drain_s: 30
models:
  model-a: {rpm: 30000, tpm: 60000000, latency_ms_median: 300, latency_sigma: 0.4, transient_failure_rate: 0.10, permanent_failure_rate: 0.02}
  model-b: {rpm: 20000, tpm: 40000000, latency_ms_median: 500, latency_sigma: 0.4, transient_failure_rate: 0.10, permanent_failure_rate: 0.02}
batch_job:
  total: 10000
  mix: {model-a: 0.6, model-b: 0.4}
  token_size: 1000
  callback_reject_first: 0
  kill_gateway_after_fraction: 0.3
engine: {queue_max: 100000, queue_ttl_s: 60, max_attempts: 3, headroom: 0.98}
